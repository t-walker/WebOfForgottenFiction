<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Web of Forgotten Fiction</title>
  <!-- A library due-date card: paper, ruled in faint blue, stamped in red. -->
  <rect width="64" height="64" rx="6" fill="#faf6ec"/>
  <g stroke="#a9bccd" stroke-width="2" opacity="0.55">
    <path d="M6 20h52M6 32h52M6 44h52"/>
  </g>
  <!-- The stamp, angled the way it sits on the cover art. -->
  <g transform="rotate(-8 32 32)">
    <rect x="9" y="24" width="46" height="16" rx="2.5" fill="none" stroke="#c4362a" stroke-width="3"/>
    <path d="M17 32h30" stroke="#c4362a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
